name: Sync public GitHub repositories

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'src/data/github-repositories.json'
      - 'scripts/sync-public-repositories.mjs'
      - '.github/workflows/sync-public-repositories.yml'

permissions:
  contents: write

concurrency:
  group: public-repository-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sync all public repositories
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run sync:public-repos

      - name: Commit repository snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/github-repositories.json
          if git diff --cached --quiet; then
            echo "Public repository snapshot is already up to date."
          else
            git commit -m "chore(portfolio): sync public GitHub repositories"
            git push origin HEAD:main
          fi
