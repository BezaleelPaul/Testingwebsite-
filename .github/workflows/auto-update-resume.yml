name: Auto-Organize & Sync Resume

on:
  schedule:
    # Run weekly on Sunday at midnight UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      new_skill:
        description: 'New Skill to add and categorize (e.g. "Docker:Tools")'
        required: false
        type: string
      new_cert:
        description: 'New Certification (e.g. "Cloud Computing — Google, May 2026")'
        required: false
        type: string
      post_update:
        description: 'Brief summary of social post or achievement to sync'
        required: false
        type: string

permissions:
  contents: write

jobs:
  sync-resume:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run Resume Auto-Sync & Reorganization
        run: |
          ARGS=""
          if [ -n "${{ inputs.new_skill }}" ]; then
            ARGS="$ARGS --skill \"${{ inputs.new_skill }}\""
          fi
          if [ -n "${{ inputs.new_cert }}" ]; then
            ARGS="$ARGS --cert \"${{ inputs.new_cert }}\""
          fi
          if [ -n "${{ inputs.post_update }}" ]; then
            echo "Processing post update: ${{ inputs.post_update }}"
          fi
          eval "node scripts/sync-resume.js $ARGS"

      - name: Commit and push updated resume files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action [Resume Auto-Sync]"
          git add resume/ public/ src/data/
          git diff --staged --quiet || git commit -m "chore(resume): auto-organize and sync resume data"
          git push origin main
